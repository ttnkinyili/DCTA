<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trust Score Equation</title>
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #ffffff;
      font-family: 'Times New Roman', serif;
    }
    .equation-container {
      padding: 60px 80px;
      text-align: center;
    }
    .equation-container .MathJax {
      font-size: 1.6em;
    }
  </style>
</head>
<body>
  <div class="equation-container">
    $$T = W_{\text{short}} \cdot T_{\text{instant}} + \left(1 - W_{\text{short}}\right) \cdot T_{\text{history}} \cdot D_{\text{long}}$$
  </div>
</body>
</html>
